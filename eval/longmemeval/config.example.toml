# LongMemEval-S formal role-aware experiment.
#
# Prerequisite: --credential-workspace must point to a workspace containing a
# valid Codex credential named "codex_default". The embedding key is read from
# BENCH_EMBED_API_KEY.

[benchmark.longmemeval]
variant = "role-aware-luna"
require_full_dataset = true
strict_role_policy = true
expected_dataset_sha256 = "d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"
expected_model = "gpt-5.6-luna"
expected_embedding_model = "text-embedding-v3"
qa_effort = "max"
consolidation_effort = "medium"
query_effort = "medium"
history_gate_effort = "low"
compaction_effort = "none"
consolidation_sessions_per_batch = 16
post_response_invalidation = false
judge_effort = "xhigh"
judge_max_output_tokens = 25000
judge_audit_effort = "max"
judge_audit_size = 50

[llm]
main = "luna_main"
fast = "luna_fast"
agent = "luna_agent"

# Default role: memory consolidation and the local Judge provider. Judge uses
# a per-call xhigh override; consolidation explicitly uses medium.
[llm.runtimes.luna_main]
provider = "codex"
model = "gpt-5.6-luna"
auth = "codex_default"
reasoning_effort = "medium"
supported_reasoning_efforts = ["none", "low", "medium", "high", "xhigh", "max"]
context_window = 400000
max_output_tokens = 0
input_modalities = ["text"]
reasoning_summary = "none"

# Fast role: HyDE and retrieval helpers. History gate overrides this to low.
[llm.runtimes.luna_fast]
provider = "codex"
model = "gpt-5.6-luna"
auth = "codex_default"
reasoning_effort = "medium"
supported_reasoning_efforts = ["none", "low", "medium", "high", "xhigh", "max"]
context_window = 400000
max_output_tokens = 0
input_modalities = ["text"]
reasoning_summary = "none"

# Agent role: final QA, temporal/multi-session reasoning, and tool planning.
[llm.runtimes.luna_agent]
provider = "codex"
model = "gpt-5.6-luna"
auth = "codex_default"
reasoning_effort = "max"
supported_reasoning_efforts = ["none", "low", "medium", "high", "xhigh", "max"]
context_window = 400000
max_output_tokens = 0
input_modalities = ["text"]
reasoning_summary = "none"

[agent]
system_prompt = "You are a helpful personal assistant with long-term memory. Retrieve evidence before answering and respond concisely in English."
max_iterations = 12

[agent.context.compaction]
keep_recent_tokens = 20000
reasoning_effort = "none"

[agent.tools]
search_enabled = false
spawn_enabled = false

[agent.wiring]
context = "default"
memory = "default"
toolsets = ["meta_common"]

[channels.chat]
enabled = false

[memory]
enabled = true

[memory.reasoning]
consolidation_effort = "medium"

[memory.embedding]
model = "text-embedding-v3"
api_key = "${BENCH_EMBED_API_KEY}"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# The benchmark runtime materialises these convenience tables into the default
# memory plugin's workspace-local config before building production services.
[memory.retrieval]
top_k_history = 8
score_threshold = 0.40
relative_delta = 0.20
route_intention = true
procedure_guard_enabled = true

[memory.retrieval.thresholds]
procedure = 0.60
preference = 0.45
event = 0.45
profile = 0.45

[memory.retrieval.inject]
max_chars = 4000
forced = 3
procedure_preference = 4
event_profile = 6
line_max = 400

[memory.gate]
enabled = true
llm_timeout_ms = 60000
max_tokens = 150
reasoning_effort = "low"

[memory.query_rewrite]
enabled = true
timeout_ms = 60000
max_tokens = 80
reasoning_effort = "medium"

[memory.hyde]
enabled = true
timeout_ms = 60000
max_tokens = 80
reasoning_effort = "medium"

[proactive]
enabled = false
profile = "quiet"

[proactive.target]
channel = ""
chat_id = ""
