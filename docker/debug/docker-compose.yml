services:
  roxy-debug:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: roxy-agent-debug:latest
    working_dir: /app
    environment:
      ROXY_DEBUG_CONFIG: /sandbox/config.toml
      ROXY_DEBUG_WORKSPACE: /sandbox/workspace
      ROXY_WEB_HOST: 0.0.0.0
      ROXY_WEB_PORT: "2236"
      ROXY_WEB_ALLOW_NON_LOOPBACK: "1"
      ROXY_READINESS_TIMEOUT_S: "60"
      ROXY_HOST_GID: "${GID:-1000}"
      ROXY_HOST_UID: "${UID:-1000}"
      ROXY_DEBUG_PROFILE: "${ROXY_DEBUG_PROFILE:-default}"
      ROXY_EXTRA_PLUGIN_DIRS: /app/docker/debug/plugins
      ROXY_REPLAY_CHANNEL: "${ROXY_REPLAY_CHANNEL:-replay}"
      HOME: /sandbox/home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../..:/app
      - ./profiles/${ROXY_DEBUG_PROFILE:-default}:/sandbox
      - ${HOME}/.roxy-plugin/cache:/sandbox/home/.roxy-plugin/cache:ro
    ports:
      - "127.0.0.1:2236:2236"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
