services:
  model-gate:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: roxy-agent-control-gate:latest
    entrypoint:
      - python
      - docker/debug/model_gate.py
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../..:/app:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()
      interval: 1s
      timeout: 3s
      retries: 30

  roxy-control-gate:
    image: roxy-agent-control-gate:latest
    command:
      - gateway
    working_dir: /app
    read_only: true
    environment: &control-environment
      ROXY_DEBUG_CONFIG: /sandbox/config.toml
      ROXY_DEBUG_WORKSPACE: /sandbox/workspace
      ROXY_HOST_GID: "${GID:?set by programmatic_control_probe.py}"
      ROXY_HOST_UID: "${UID:?set by programmatic_control_probe.py}"
      ROXY_WEB_HOST: 0.0.0.0
      ROXY_WEB_ALLOW_NON_LOOPBACK: "1"
      HOME: /sandbox/home
      PYTHONUNBUFFERED: "1"
    volumes: &control-volumes
      - ${ROXY_CONTROL_SANDBOX:?set by programmatic_control_probe.py}/app:/app:ro
      - ${ROXY_CONTROL_SANDBOX:?set by programmatic_control_probe.py}:/sandbox
      - ${ROXY_CONTROL_SANDBOX:?set by programmatic_control_probe.py}/static:/app/static
    tmpfs:
      - /tmp
    depends_on:
      model-gate:
        condition: service_healthy

  control-probe:
    image: roxy-agent-control-gate:latest
    working_dir: /app
    read_only: true
    environment:
      <<: *control-environment
      ROXY_MODEL_GATE_URL: http://model-gate:8090
    volumes: *control-volumes
    tmpfs:
      - /tmp
    depends_on:
      model-gate:
        condition: service_healthy
      roxy-control-gate:
        condition: service_started
