services:
  roxy-plugin-gate:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: roxy-agent-plugin-gate:latest
    working_dir: /app
    read_only: true
    environment:
      ROXY_DEBUG_CONFIG: /sandbox/config.toml
      ROXY_DEBUG_WORKSPACE: /sandbox/workspace
      ROXY_HOST_GID: "${GID:?set by plugin_hot_reload_probe.py}"
      ROXY_HOST_UID: "${UID:?set by plugin_hot_reload_probe.py}"
      ROXY_PLUGIN_LOG_LEVEL: DEBUG
      HOME: /sandbox/home
      PYTHONPATH: /sandbox/python-packages:/app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${ROXY_GATE_SANDBOX:?set by plugin_hot_reload_probe.py}/app:/app:ro
      - ${ROXY_GATE_SANDBOX:?set by plugin_hot_reload_probe.py}:/sandbox
      - ${ROXY_GATE_SANDBOX:?set by plugin_hot_reload_probe.py}/static:/app/static
      - ${ROXY_PLUGIN_SOURCE:?set by plugin_hot_reload_probe.py}:/fixtures/plugins:ro
    tmpfs:
      - /tmp
