services:
  change-gate:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: roxy-agent-change-gate:latest
    working_dir: /app
    read_only: true
    environment:
      ROXY_DEBUG_CONFIG: /sandbox/config.toml
      ROXY_DEBUG_WORKSPACE: /sandbox/workspace
      ROXY_HOST_GID: "${GID:?set by gate.py}"
      ROXY_HOST_UID: "${UID:?set by gate.py}"
      ROXY_GATE_INVENTORY: /sandbox/source-inventory.json
      ROXY_PLUGIN_HOME: /sandbox/plugin-home
      HOME: /sandbox/home
      npm_config_offline: "true"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${ROXY_CHANGE_GATE_SANDBOX:?set by gate.py}/app:/app:ro
      - ${ROXY_CHANGE_GATE_SANDBOX:?set by gate.py}:/sandbox
      - ${ROXY_CHANGE_GATE_SANDBOX:?set by gate.py}/static:/app/static
    tmpfs:
      - /tmp
